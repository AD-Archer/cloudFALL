      DIRECTION CONTRACT · cloudFALL front page · seed 3641eaad

      THESIS: cloudFALL is one piece of arithmetic — what your household
      pays every year to rent things it could own — and this page refuses
      the YSWS category's loud saturated hero, step-cards and prize-grid
      scaffold in favour of a quiet ruled page where that number is the
      loudest thing on it.

      OWN-WORLD: Warm paper ground. One band of the wordmark's dusty blue
      at each end, joined to the paper by a hand-drawn horizon. Ink is a
      blue-grey, never black. Alegreya over Alegreya Sans, two faces only.
      Peach and spike-orange belong to the mascot and to money, nowhere
      else. No cards and no panels — sections are told apart by space.

      STORY: A visitor learns what this is in one sentence, ticks the
      subscriptions their house actually pays for, sees the year's total
      in their own money, and leaves either signed up or reading the docs.

      FIRST VIEWPORT: Sky band. The hand-lettered wordmark runs full
      bleed across the top, outside the content column, carrying the
      mascot as the o of cloud. Below it and left-aligned to the page
      margin: the thesis in one line, one sentence of explanation, two
      actions, and a quiet live status line. A drawn horizon closes the
      band. No nav — the page is one scroll. No standalone mascot here;
      his first solo appearance is the docs section.

      FORM: Calm ruled page. Chosen by the user over three dealt
      structures — the direction round was stopped in favour of "calm and
      simple", which overrides the roll.

      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, and DESIGN.md
    -->
