<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CloudFALL: stop renting your own stuff</title>
    <meta
      name="description"
      content="A Hack Club You Ship, We Ship. Pick a subscription you pay for every month, build the self-hosted replacement, ship it open-source and spend the hours you log on discs to keep your library on."

    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#5341f0" />

    <!-- Link previews. %SITE_URL% is substituted at build time (vite.config.js);

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloudFALL" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="CloudFALL: stop renting your own stuff" />
    <meta
      property="og:description"
      content="Destroy the cloud by making it free. Build the self-hosted replacement for something you pay monthly for, ship it open-source, keep the hardware."
    />
    <meta property="og:image" content="%SITE_URL%/cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="958" />
    <meta property="og:image:height" content="549" />
    <meta
      property="og:image:alt"
      content="The CloudFALL logo: a hand-drawn cloud with orange spikes and a single eye, floating in a violet sky beside the word CloudFALL."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="CloudFALL: stop renting your own stuff"
    />

      name="twitter:description"
      content="Destroy the cloud by making it free. Build the self-hosted replacement for something you pay monthly for, ship it open-source, keep the hardware."
    />
    <meta name="twitter:image" content="%SITE_URL%/cover.jpg" />
    <meta
      name="twitter:image:alt"
      content="The CloudFALL logo: a hand-drawn cloud with orange spikes and a single eye, floating in a violet sky beside the word CloudFALL."
    />
